<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CKA Paper Maker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Noto+Nastaliq+Urdu&family=Noto+Naskh+Arabic:wght@400;700&display=swap">
<style>
:root{--bg:#f3f1ec;--panel:#fff;--ink:#1d2433;--mute:#667085;--line:#d9d6ce;--acc:#1f4e8c;--acc-ink:#fff;--field:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171d;--panel:#1d222b;--ink:#e8eaee;--mute:#9aa3b2;--line:#323a47;--acc:#6ea0e6;--acc-ink:#0c1522;--field:#151920}}
:root[data-theme="dark"]{--bg:#14171d;--panel:#1d222b;--ink:#e8eaee;--mute:#9aa3b2;--line:#323a47;--acc:#6ea0e6;--acc-ink:#0c1522;--field:#151920}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Atkinson Hyperlegible",system-ui,sans-serif}
.app{display:grid;grid-template-columns:minmax(320px,440px) 1fr;gap:20px;padding:16px;max-width:1500px;margin:auto}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;flex-wrap:wrap;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.logo{width:64px;height:64px;border-radius:50%;background:#fff;overflow:hidden;display:grid;place-items:center;flex:none}.logo img{width:100%;height:100%;object-fit:contain;display:block}
.top .t{line-height:1.2}.top .t b{font-size:17px;display:block}.top .t small{font-size:11px;color:var(--mute)}
.top .sp{flex:1}
.pri{background:#123a6b;border-color:#123a6b;color:#fff}
.icon{width:38px;height:38px;padding:0;border-radius:10px}
.tabs{display:flex;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:12px}
.tabs button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px;font-weight:700;color:var(--mute)}
.tabs button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.mtabs{display:none}
.panel{border-radius:14px}
.sc .sechead{cursor:pointer;margin:0}.sc .sub2{font-size:12px;color:var(--mute)}
.mono{white-space:nowrap;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--mute)}
.sc.closed{padding:12px 14px}
.mc.closed{padding:10px 12px}.mc .sechead{cursor:pointer;gap:8px}
.chev{flex-shrink:0;transition:transform .15s}.chev.up{transform:rotate(180deg)}
.sc .sechead{gap:8px}.sc .sechead .bar{flex-wrap:nowrap;flex-shrink:0}
.addgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.addgrid button{padding:12px 6px;font-size:13px;background:var(--bg)}
.pvbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:8px}
.pvbar b{font-size:13px}.pvbar .sp{flex:1}
.bbar{display:none}
.app>*,.pv{min-width:0}
#scaler{transform-origin:0 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;z-index:40;background:#1d2433;color:#fff;padding:8px 8px 8px 14px;border-radius:10px;font-size:14px;display:flex;gap:10px;align-items:center}
.toast[hidden]{display:none}.toast button{background:#fff;color:#1d2433}
@media(min-width:901px){
 .app{height:calc(100vh - 60px);height:calc(100dvh - 60px);padding-bottom:0}
 #editor,.pv{overflow:auto;height:100%;padding-bottom:16px}
}
@media(max-width:900px){
 .app{grid-template-columns:1fr;padding:12px 12px 84px}
 .mtabs{display:flex}
 body[data-view="prev"] #editor{display:none}
 body:not([data-view="prev"]) .pv{display:none}
 .dltop{display:none}.toast{bottom:84px}
 .bbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;gap:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--panel);border-top:1px solid var(--line)}
 .bbar button{flex:1;padding:12px;font-size:15px}
}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
h1{font-size:20px;margin:0 0 2px}
.sub{color:var(--mute);margin:0 0 12px;font-size:13px}
label{display:block;font-size:12px;color:var(--mute);margin:8px 0 3px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:6px;padding:7px 9px}
textarea{min-height:120px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 90px 90px;gap:10px}
button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 12px}
button.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:700}
button.sm{padding:3px 8px;font-size:13px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sechead{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.hint{font-size:12px;color:var(--mute);margin:4px 0 0}
.sticky{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0}
.sheetwrap{overflow:auto}

/* ---------- the paper ---------- */
.paper{background:#fff;color:#000;width:210mm;min-height:297mm;margin:0 auto;padding:12mm 14mm;font:14px/1.5 "Tinos","Times New Roman","Noto Nastaliq Urdu",serif;box-shadow:0 2px 14px rgba(0,0,0,.18)}
.paper .school{text-align:center;font-family:"Times New Roman",Tinos,"Liberation Serif",serif;color:#000;font-size:var(--fs1,26px);line-height:1.1;font-weight:700;text-transform:uppercase;margin:0}
.paper .sub{text-align:center;font-weight:700;font-family:"Times New Roman",Tinos,"Liberation Serif",serif;color:#000;font-size:var(--fs2,12px);line-height:1.1;margin:6px 0 0;text-transform:uppercase}
.paper .ses{text-align:center;color:#000;font:700 var(--fs4,13px)/1.1 Calibri,Carlito,"Segoe UI",Arial,sans-serif;margin:3px 0 0}
.paper .idr{display:flex;align-items:flex-end;gap:14px;margin:6px 0;font-size:12px}
.paper .idr .f{display:flex;align-items:flex-end;gap:5px;flex:var(--w,1) 1 0;min-width:0}
.paper .idr .l{white-space:nowrap}
.paper .idbox{border:2px solid #000;padding:4px 14px;margin:2px 0 12px}
.paper .idr .u{flex:1;border-bottom:1.5px solid #000;min-height:1.35em;text-align:center;font-weight:700;overflow:hidden;white-space:nowrap}
.paper .exam{text-align:center;font-weight:700;font-family:"Times New Roman",Tinos,"Liberation Serif",serif;color:#000;font-size:var(--fs3,15px);line-height:1.1;margin:1px 0 0}
.paper .box{border:2px solid #000;padding:8px 12px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px 20px;margin-bottom:12px;font-size:14px}
.paper .bf{display:flex;align-items:flex-end;gap:5px;white-space:nowrap}
.paper .bl{flex:1;border-bottom:1px solid #000;min-width:50px;height:1.1em}
.paper .box .wide{grid-column:1/-1}
.paper .sec{margin-top:12px}
.paper .st{display:flex;justify-content:space-between;font-weight:700;font-size:15px;break-after:avoid}
.paper .q{margin:3px 0 3px 18px;break-inside:avoid}
.paper .opts{display:flex;gap:6px 28px;flex-wrap:wrap;margin:1px 0 4px 22px}
.paper .tf{float:right;font-size:13px}
.paper .tfbox{display:inline-block;width:34px;height:20px;border:1.5px solid #000;vertical-align:middle;margin-top:-2px}
.paper .ln{border-bottom:1px solid #000;height:var(--lh,.4cm);margin:0 0 0 22px}
.paper .blank{display:inline-block;min-width:90px;border-bottom:1px solid #000}
.paper [dir=rtl]{text-align:right}
.mc{border:1px solid var(--line);border-radius:8px;padding:12px 12px;margin:8px 0}.mc>.sechead{margin-bottom:12px;gap:10px}.mc>.sechead .bar{gap:10px}
.opt span{white-space:nowrap}
.opt{display:grid;grid-template-columns:34px 1fr;gap:6px;align-items:center;margin-top:5px}
.opt input[type=radio]{width:auto;margin:0}
.paper .key{break-before:page}
.paper .sh{position:relative;text-align:center;font-weight:700;font-size:15px;margin:14px 0 6px}
.paper .sh span{text-decoration:underline}
.paper .sh .gm{position:absolute;right:0;top:0}
.paper .opts.og{display:grid;gap:2px 16px}
.paper .og.c4{grid-template-columns:repeat(4,1fr)}
.paper .og.c2{grid-template-columns:repeat(2,1fr)}
.paper .og.c1{grid-template-columns:1fr}
.paper .rem{display:block;text-align:center;white-space:pre;font-weight:700;letter-spacing:2px;font-size:16px;margin-top:18px}
.paper .rem::before{content:"------  "}
.paper .rem::after{content:"  ------"}
.paper .rem span{white-space:pre-wrap}
.paper .lq{margin-left:0;margin-top:6px}
.paper .end{text-align:center;letter-spacing:4px;margin:14px 0 0}
.paper .note{font-style:italic;font-size:13px;margin:1px 0 3px 2px}
.paper .hd{display:flex;align-items:center;justify-content:center;gap:2px;margin-bottom:2px}
.paper .hd .ht{flex:1;padding-right:34px}
.paper .hd.top{flex-direction:column;gap:2px}
.paper .hd.top .ht{padding-right:0}
.paper sup{font-size:65%;line-height:0}
.paper .ht p{-webkit-text-stroke:.25px #000;text-rendering:optimizeLegibility}
.paper .hd img{height:112px;width:112px;min-width:112px;max-width:112px;flex:0 0 112px;object-fit:fill}
.paper .ht{text-align:center}
.paper .kl{margin:2px 0 2px 18px}
.gate{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.gate[hidden]{display:none}
button.wa{background:#25D366;border-color:#25D366;color:#fff;font-weight:700}button.wa:disabled{opacity:.6}
[data-add]:disabled{opacity:.4;cursor:not-allowed}
.welcome{flex-direction:column}.gatebox.wb img{width:120px;height:120px;object-fit:contain;display:block;margin:0 auto 14px}.gatebox.wb h2{margin:0 0 6px;font-size:22px}.gatebox.wb p{margin:0 0 18px;color:var(--mute);font-size:14px}
.gatebox{background:var(--panel);color:var(--ink);border-radius:12px;padding:24px;max-width:420px;width:100%;text-align:center}
.gatebox h2{font-size:19px;margin:0 0 16px;line-height:1.8}
.gatebox .bar{justify-content:center}
button.big{font-size:20px;padding:10px 28px;font-family:"Noto Nastaliq Urdu","Atkinson Hyperlegible",sans-serif;line-height:1.8}
@font-face{font-family:"JameelNooriNastaliq";src:local("Jameel Noori Nastaleeq"),local("JameelNooriNastaleeq"),local("Jameel Noori Nastaliq"),url(https://cdn.jsdelivr.net/npm/jameel-noori/fonts/jameel-noori-nastaleeq4.woff2) format("woff2"),url(https://unpkg.com/jameel-noori/fonts/jameel-noori-nastaleeq4.woff2) format("woff2");font-display:swap}
.paper.rtl{direction:rtl;font-family:"Noto Naskh Arabic","Noto Nastaliq Urdu","Times New Roman",serif;line-height:1.8}.paper.rtl.nast{font-family:"JameelNooriNastaliq","Jameel Noori Nastaleeq","Noto Nastaliq Urdu","Noto Naskh Arabic","Times New Roman",serif;line-height:2.1;font-size:15px}.paper.rtl.nast .sh,.paper.rtl.nast .st{font-size:17px}.paper.rtl.nast .sh span{text-decoration:underline;text-underline-offset:4px}.paper.rtl .note{font-style:normal}
.paper.rtl .q{margin:3px 18px 3px 0}
.paper.rtl .opts{margin:1px 22px 4px 0}
.paper.rtl .ln{margin:0 22px 0 0}
.paper.rtl .tf{float:left}
.paper.rtl .sh .gm{right:auto;left:0}
.paper.rtl .note{margin:1px 2px 3px 0}
.paper.rtl .lq{margin-right:0}
.paper.rtl .hd{direction:ltr}
.paper.rtl .idbox{direction:rtl}
.paper.rtl .idr .l{direction:rtl;unicode-bidi:isolate}
.paper.rtl .idr .u{unicode-bidi:plaintext}
.paper.rtl .end,.paper.rtl .rem{letter-spacing:0}
.paper.rtl .idr .u{line-height:1.9;overflow:visible;padding-top:.25em}
.paper.rtl .ln{height:var(--lh,.4cm);line-height:0;font-size:0}
/* Urdu student-details box only: match reference layout */
.paper.rtl .idbox{border:2px solid #000;padding:5px 12px 3px;margin:2px 0 12px}
.paper.rtl .idbox .idr{font-size:14px;gap:14px;margin:0;align-items:flex-end}
.paper.rtl .idbox .idr .f{gap:4px}
.paper.rtl .idbox .idr .l{font-weight:400;-webkit-text-stroke:0;line-height:2.1;font-family:"JameelNooriNastaliq","Jameel Noori Nastaleeq","Noto Nastaliq Urdu",serif}
.paper.rtl .idbox .idr .u{border-bottom:1.2px solid #000;min-height:1.5em;line-height:1.7;padding-top:0;font-size:13px;font-weight:700;font-family:Calibri,Carlito,Arial,"JameelNooriNastaliq","Noto Nastaliq Urdu",sans-serif}
@page{size:A4;margin:0}
@media print{
 #scaler{transform:none!important;width:auto!important;height:auto!important}.sheetwrap{height:auto!important;overflow:visible!important}
 body{background:#fff}
 .app{height:auto!important}.pv,#editor{overflow:visible!important;height:auto!important}
 .noprint{display:none!important}
 .app{display:block;padding:0;max-width:none}
 .sheetwrap{overflow:visible}
 .paper{box-shadow:none;margin:0;width:100%;min-height:0;padding:12mm 14mm}
}
</style>

function pageCuts(el){
 var W=el.offsetWidth,k=210/W,mg=10;
 var top=el.getBoundingClientRect().top,total=el.scrollHeight,bs=[],fs=[];
 el.querySelectorAll(".key").forEach(function(n){fs.push(n.getBoundingClientRect().top-top)});
 el.querySelectorAll(".q,.opts,.ln,.kl,.hd,.idr,.box,.end").forEach(function(n){
  var nx=n.nextElementSibling,c=n.classList;
  if(c.contains("q")&&nx&&(nx.classList.contains("opts")||nx.classList.contains("ln")))return;
  if(c.contains("ln")&&nx&&nx.classList.contains("ln"))return;
  bs.push(n.getBoundingClientRect().bottom-top)});
 var cuts=[0],start=0,pg=0;
 while(true){
  var end=start+(297-mg*(pg?2:1))/k,cut=-1;
  fs.forEach(function(f){if(f>start+5&&f<=end)cut=f});
  if(cut<0){
   if(total<=end)break;
   bs.forEach(function(b){if(b>start+30&&b<=end)cut=b});
   if(cut<0)cut=end;
  }
  cuts.push(cut);start=cut;pg++;
 }
 cuts.push(total);
 return cuts;
}

   all.forEach(function(n,j){if(!n.matches(ATOM))return;var c=(pos[j][0]+pos[j][1])/2;if(c<a||c>=b)n.style.display="none"});
   for(var j=all.length-1;j>=0;j--){var n=all[j];if(n.matches(ATOM)||!n.querySelector(ATOM))continue;
    if(![].some.call(n.querySelectorAll(ATOM),function(x){return x.style.display!=="none"}))n.style.display="none"}
   if(i)pc.style.paddingTop="0";pc.style.paddingBottom="0";
   stage.innerHTML="";stage.appendChild(pc);
   var cv=await html2canvas(pc,{scale:2,backgroundColor:"#ffffff",useCORS:true,logging:false,windowWidth:1000});
   var w=210,h=cv.height/cv.width*210,av=(i?297-MG*2:297-MG)+4;
   if(h>av){w=210*av/h;h=av}
   if(i)pdf.addPage();
   pdf.addImage(cv.toDataURL("image/jpeg",0.92),"JPEG",(210-w)/2,i?MG:0,w,h);
  }
  return pdf.output("blob");
 }finally{stage.remove()}
}

async function doWa(btn){
